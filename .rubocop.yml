require:
  - rubocop-rails
  - rubocop-rspec

AllCops:
  NewCops: enable
  TargetRubyVersion: 3.2
  Exclude:
    - "bin/**/*"
    - "db/**/*"
    - "config/**/*"
    - "vendor/**/*"

Rails/ApplicationRecord:
  Enabled: false

RSpec/ExampleLength:
  Max: 25

Metrics/MethodLength:
  Max: 25

RSpec/MultipleExpectations:
  Enabled: false

Metrics/AbcSize:
  Max: 25

Metrics/CyclomaticComplexity:
  Max: 10